name: CI

on:
  push:
  pull_request:

jobs:
  no-paper-data:
    # The repository ships the application only. Fail if any tracked file
    # looks like paper text, chunks, vectors, extracted data or a secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        run: |
          bad=$(git ls-files | grep -E '\.(xlsx|xls|csv|parquet|sqlite|db|npy|npz|pkl|pickle|lance|jsonl|xml\.gz|json\.gz|log|gguf)$|(^|/)\.env$|(^|/)(runs|outputs|work|cache|logs|inputs)/' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"; echo "$bad"; exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          pip install -r requirements-dev.txt
      - name: Test
        run: pytest
